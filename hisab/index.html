<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
 --ocean-dark:#0a3d62; --ocean-mid:#0c6397; --ocean-light:#38ada9;
 --gold:#f6b93b; --coral:#eb2f06; --emerald:#079992;
 --green-win:#2ecc71; --red-lose:#e74c3c; --card-bg:rgba(255,255,255,.96);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal','Segoe UI',Tahoma,Verdana,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(180deg,var(--ocean-dark) 0%,var(--ocean-mid) 50%,var(--ocean-light) 100%);color:#1e272e;min-height:100vh;display:flex;justify-content:center;overflow-x:hidden}
.app{width:100%;max-width:480px;align-self:flex-start;display:flex;flex-direction:column;position:relative;padding-bottom:10px}

.top-bar{background:rgba(10,61,98,.94);color:#fff;padding:10px 12px;position:sticky;top:0;z-index:100;border-bottom:2px solid rgba(255,255,255,.15);box-shadow:0 4px 15px rgba(0,0,0,.25)}
.trow{display:flex;align-items:center;gap:10px}
.tname{font-weight:700;font-size:.95rem;line-height:1.5}
.tsmall{font-size:.72rem;opacity:.85;line-height:1.6}
.credit{text-align:left;font-size:.66rem;opacity:.8;line-height:1.6;max-width:150px}
.kufi{font-family:'Noto Naskh Arabic','Amiri','Traditional Arabic','Tajawal','Segoe UI',Tahoma,serif;color:#fff}
.idscr{position:fixed;inset:0;background:linear-gradient(170deg,#062f52 0%,#0a3d62 45%,#0b4f7d 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px 20px;z-index:4000;overflow-y:auto}
.idbox{width:100%;max-width:420px;border:2px solid rgba(246,185,59,.55);border-radius:20px;padding:26px 18px;background:rgba(255,255,255,.05)}
.idl1{font-size:1.18rem;font-weight:700;line-height:2.1;letter-spacing:.5px}
.idl2{font-size:1.42rem;font-weight:700;line-height:1.9;letter-spacing:.5px}
.idl2s{font-size:1.18rem;font-weight:700;line-height:1.9;letter-spacing:.5px}
.idrule{height:2px;background:linear-gradient(90deg,rgba(246,185,59,0),rgba(246,185,59,.9),rgba(246,185,59,0));margin:16px auto;width:85%}
.idl3{font-size:1.04rem;font-weight:600;line-height:2.1}
.idl4{font-size:1rem;font-weight:600;line-height:2.1;opacity:.95}
.idfade{animation:idIn .7s ease both}
.netwrap{display:flex;justify-content:center;margin:2px 0 8px}
.top-bar.slim{padding-bottom:4px}
.top-bar.slim .trow{margin-bottom:2px}
.top-bar.slim .backb{padding:6px;font-size:.82rem;margin:2px 0 0}
.qgrid{display:grid;gap:8px;grid-template-columns:1fr;grid-template-areas:'score' 'main'}
.qgrid.fbon{grid-template-columns:1fr 47%;grid-template-areas:'score side' 'main main'}
.ga-score{grid-area:score;min-width:0}
.ga-side{grid-area:side;min-width:0;display:none}
.qgrid.fbon .ga-side{display:block}
.ga-main{grid-area:main;min-width:0}
.ga-side .fb{padding:8px 6px;margin:0 0 6px;border-radius:12px}
.ga-side .fb h4{font-size:.95rem;margin:2px 0}
.ga-side .fb p{font-size:.76rem;line-height:1.6;margin:0}
.ga-side .netwrap svg{width:100%;height:auto}
@media(min-width:760px){
 .app:has(.qgrid){max-width:1000px}
 .qgrid,.qgrid.fbon{grid-template-columns:25% 1fr 27%;grid-template-areas:'score main side';gap:14px}
 .qgrid .ga-side{display:block;visibility:hidden}
 .qgrid.fbon .ga-side{visibility:visible}
 .ga-side .fb p{font-size:.9rem}
}
.dvslot{display:flex;justify-content:flex-end;margin:0}
@media(max-width:759px){.ga-side .netwrap svg{max-height:66px}.ga-side .netwrap{margin:0 0 4px}.ga-side .fb h4{font-size:.88rem}.ga-side .dvb svg{max-height:112px}.dvb{padding:6px 5px}.dvt{font-size:.7rem;margin-bottom:2px}.dvb2{font-size:.84rem}.dvb3{font-size:.72rem}}
.dvslot:empty{display:none}
.dvb{background:#fff;border-radius:12px;padding:8px 6px;margin:0;width:100%;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:idIn .4s ease both}
@media(min-width:680px){.dvb{max-width:300px;padding:10px 8px}}
.tfr{display:inline-grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px;background:#eef7fb;border:2px solid #cfe3f0;border-radius:10px}
.cel{width:22px;height:22px;border-radius:50%;background:#fff;border:2px dashed #b9cfdf}
.cel.on{background:#1E6FD9;border:2px solid #124A94}
.cel.mv{background:#2ecc71;border:2px solid #1e8449;animation:pop .5s ease}
.cel.gap{border-color:#e74c3c;animation:blink 1s infinite}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.dmwrap{text-align:center}
.mny{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:6px 0}
.note{width:40px;height:26px;border-radius:5px;background:#1e9e5a;border:2px solid #0f6e3c;color:#fff;font-weight:800;font-size:.72rem;display:flex;align-items:center;justify-content:center}
.coin{width:22px;height:22px;border-radius:50%;background:#f6b93b;border:2px solid #a8750a;color:#2b1b00;font-weight:800;font-size:.68rem;display:flex;align-items:center;justify-content:center}
.note.hi,.coin.hi{animation:blink 1.1s infinite;box-shadow:0 0 0 3px rgba(231,76,60,.5)}
.xnote{background:#fff;border:2px solid #f6b93b;border-radius:10px;padding:8px;margin:6px 0;font-size:.78rem;font-weight:700;color:#2f3542;line-height:1.8}
.xbig{font-weight:800;color:#0a3d62;font-size:.92rem}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.btnrow .btn{margin:0}
.dmtxt{font-size:.95rem;font-weight:800;color:#0a3d62;line-height:1.9;margin:8px 0}
.dmbig{font-size:1.5rem;font-weight:800;color:#0a3d62;margin:6px 0}
.dmlbl{font-size:.74rem;font-weight:800;color:#57606f;margin-bottom:2px}
.dmdots{display:flex;justify-content:center;gap:6px;margin:8px 0}
.dmdot{width:9px;height:9px;border-radius:50%;background:#cfd8e3}
.dmdot.on{background:#f6b93b}
.nline{width:100%;max-width:300px}
.bar{height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:.82rem}
.dvq{text-align:center;font-size:1.02rem;font-weight:800;color:#0a3d62;margin:2px 0 6px}
.stp{background:#eef7fb;border-radius:8px;padding:5px 6px;margin-bottom:4px;font-size:.78rem;font-weight:700;color:#0c6397;text-align:center}
.stpok{color:#0b6a38}
.dvt{text-align:center;font-size:.76rem;color:#0a3d62;font-weight:700;margin-bottom:4px;line-height:1.5}
.dvb2{text-align:center;font-size:.92rem;font-weight:800;color:#0b6a38;margin-top:4px}
.dvb3{text-align:center;font-size:.78rem;color:#57606f;margin-top:1px}
.ballfly{animation:ballfly .75s cubic-bezier(.22,.68,.35,1) forwards}
@keyframes ballfly{0%{transform:translate(168px,128px) scale(.55);opacity:0}15%{opacity:1}100%{transform:translate(48px,42px) scale(1)}}
.netsh{transform-origin:50% 50%;animation:netsh .55s .62s ease-out}
@keyframes netsh{0%{transform:scale(1)}35%{transform:scale(1.05)}70%{transform:scale(.99)}100%{transform:scale(1)}}
@keyframes idIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.backb{width:100%;margin-top:8px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:11px;padding:7px;font-family:inherit;font-weight:700;font-size:.8rem;cursor:pointer}
.stats{display:flex;justify-content:space-around;background:rgba(0,0,0,.25);padding:6px 8px;border-radius:12px;font-size:.85rem;font-weight:700;margin-top:8px}

.screen{display:none;padding:14px;flex:1;animation:fade .25s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.card{background:var(--card-bg);border-radius:18px;padding:14px 16px;box-shadow:0 6px 15px rgba(0,0,0,.15);margin-bottom:14px}
.card h3{color:var(--ocean-dark);font-size:1.05rem;margin-bottom:10px}
.btn{width:100%;border:none;padding:13px;border-radius:14px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:8px;font-family:inherit}
.btn.main{background:var(--green-win);color:#fff}
.btn.gold{background:var(--gold);color:#2b1b00}
.btn.sec{background:#dfe4ea;color:#2f3542}
.btn.red{background:var(--coral);color:#fff}

.in{width:100%;padding:12px;border-radius:12px;border:2px solid #ced6e0;font-size:1rem;font-family:inherit;margin-bottom:10px;text-align:center;font-weight:700}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:12px}
.num{border:2px solid #ced6e0;background:#fff;border-radius:11px;padding:10px 0;font-family:inherit;font-size:1.05rem;font-weight:700;cursor:pointer}
.num.on{border-color:var(--emerald);background:#e8f8f6}
.lvbtn{display:block;width:100%;text-align:right;border:3px solid #ced6e0;background:#fff;border-radius:14px;padding:11px 13px;margin-bottom:9px;cursor:pointer;font-family:inherit}
.lvbtn.on{border-color:var(--emerald);background:#e8f8f6}
.lvbtn b{font-size:1rem;color:#0a3d62}
.lvbtn span{display:block;font-size:.74rem;color:#57606f;margin-top:4px;line-height:1.7}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{border:3px solid transparent;background:#f1f2f6;border-radius:14px;padding:8px 2px;cursor:pointer}
.chip span{display:block;width:34px;height:34px;border-radius:10px;margin:0 auto 4px;border:2px solid #cfd6de}
.chip div{font-size:.72rem;font-weight:700;color:#2f3542}
.chip.on{border-color:#079992;background:#e8f8f5}
.col{border:3px solid transparent;background:#f1f2f6;border-radius:14px;padding:6px 2px;cursor:pointer}
.col.on{border-color:var(--emerald);background:#e8f8f6}
.col div{font-size:.72rem;font-weight:700;margin-top:2px;color:#0a3d62}

.mrow{background:var(--card-bg);border-radius:18px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 6px 15px rgba(0,0,0,.15);border-right:6px solid var(--emerald);cursor:pointer;margin-bottom:12px}
.mrow:active{transform:scale(.99)}
.mrow.lock{opacity:.68;background:#dfe4ea;border-right-color:#747d8c;cursor:default}
.mleft{display:flex;align-items:center;gap:11px}
.memo{font-size:1.5rem;width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:#f1f2f6;border-radius:13px;font-weight:700;color:#0a3d62}
.minfo h4{font-size:.96rem;color:#0a3d62}
.minfo p{font-size:.72rem;color:#57606f;margin-top:3px;line-height:1.6}
.pill{display:inline-block;background:var(--emerald);color:#fff;font-size:.74rem;padding:4px 10px;border-radius:12px;font-weight:700}
.lock .pill{background:#747d8c}

.scoreboard{position:sticky;top:96px;z-index:50;background:var(--ocean-dark);border:2px solid rgba(255,255,255,.18);border-radius:16px;padding:10px 12px;margin-bottom:12px;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.sb{display:flex;align-items:center;gap:8px;color:#fff;padding:3px 0}
.sb .tm{flex:1;font-size:.9rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb .nu{font-size:2rem;font-weight:800;min-width:44px;text-align:center;background:rgba(255,255,255,.12);border-radius:10px;line-height:1.2}
.sb.me .nu{background:var(--gold);color:#2b1b00}
.sbfoot{color:#cfe3ef;font-size:.72rem;font-weight:700;text-align:center;margin-top:6px;border-top:1px solid rgba(255,255,255,.15);padding-top:6px}

.timer-wrap{width:100%;height:11px;background:#dfe4ea;border-radius:8px;overflow:hidden;margin-bottom:12px}
.timer-bar{height:100%;width:100%;background:linear-gradient(90deg,#2ecc71,#f6b93b,#e74c3c)}
.qbox{background:#f1f2f6;border-radius:16px;padding:18px 10px;text-align:center;margin-bottom:12px;border:2px solid #dfe4ea}
.qtext{font-size:2.1rem;font-weight:800;color:#0a3d62;display:flex;align-items:center;justify-content:center;gap:9px}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:58px;height:52px;background:#fff;border:3px dashed #0c6397;border-radius:12px;color:var(--coral);font-weight:900}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:12px}
.opt{background:#fff;border:2px solid #ced6e0;border-radius:14px;padding:14px;font-size:1.5rem;font-weight:700;color:#2f3542;cursor:pointer;font-family:inherit}
.opt.ok{background:var(--green-win)!important;color:#fff!important;border-color:#27ae60!important}
.opt.no{background:var(--red-lose)!important;color:#fff!important;border-color:#c0392b!important}
.fb{border-radius:14px;padding:13px;text-align:center;margin-bottom:10px}
.fb h4{font-size:1.2rem;margin-bottom:5px}
.fb p{font-size:.85rem;font-weight:700;line-height:1.7}
.coachbtn{width:100%;background:#fff3cd;color:#856404;border:3px dashed var(--gold);padding:13px;border-radius:14px;font-weight:700;cursor:pointer;font-family:inherit;font-size:1rem;margin-bottom:10px}
.coachbtn.must{background:#ffeaa7;border-color:var(--coral);color:#8a3418;animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.hint{background:#fffaf0;border:2px solid var(--gold);border-radius:14px;padding:12px;margin-bottom:10px;text-align:center}
.hint p{font-size:.85rem;font-weight:700;color:#0a3d62;line-height:1.8}
.shake{animation:shk .5s}
@keyframes shk{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-11px)}40%,80%{transform:translateX(11px)}}
.star{position:fixed;pointer-events:none;z-index:9999;font-size:1.7rem;animation:fly 1s ease-out forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(1.4) rotate(360deg)}}

.bottom-nav{position:static;margin:10px auto 0;width:100%;max-width:480px;border-radius:16px 16px 0 0;background:#fff;display:flex;justify-content:space-around;padding:9px 0;border-top:1px solid #dfe4ea;box-shadow:0 -4px 12px rgba(0,0,0,.12);z-index:100}
.nav{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:#747d8c;font-size:.76rem;font-weight:700;cursor:pointer;font-family:inherit}
.nav.on{color:var(--ocean-mid)}
.nav i{font-size:1.3rem;font-style:normal}
textarea{width:100%;height:150px;padding:12px;border-radius:12px;border:2px solid #ced6e0;font-size:.82rem;line-height:1.9;font-family:inherit}
@media print{body{background:#fff}.top-bar,.bottom-nav,.btn,.backb{display:none!important}.app{padding:0}.card{box-shadow:none;border:1px solid #ccc;background:#fff}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
var AR=['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
function ar(n){return String(n).split('').map(function(c){return c>='0'&&c<='9'?AR[+c]:c;}).join('');}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

var DEF_SCHOOL='مدرسة الإمام حفص الابتدائية';
var OLD_SCHOOL='مدرسة الإمام حفص الابتدائية — الطائف';
var DEF_AUTHOR='إعداد المعلم محمد العرابي';
var ID_IDARA='إدارة التعليم بمحافظة الطائف';
var ID_SCHOOL='مدرسة الإمام حفص الابتدائية';
var ID_SCHOOL2='لتحفيظ القرآن الكريم';
var ID_MANAGER='محمد ناصر السالمي';
var ID_TEACHER='محمد مساعد العرابي';
function sch(){
  var v=(player.school!==undefined&&player.school!==null)?player.school:DEF_SCHOOL;
  if(v===OLD_SCHOOL||v==='')v=DEF_SCHOOL;
  return v;
}
function aut(){return (player.author!==undefined&&player.author!==null)?player.author:DEF_AUTHOR;}
var TABLES=[1,2,3,4,5,6,7];
var GOLD=18,WIN_PCT=95;
var LEVELS={
 easy:{n:'مبتدئ',e:'🟢',ball:8,sec:4,max:7,R:100,d:'٨ ثوانٍ للكرة — هدف إذا أجبت خلال ٤ ثوانٍ<br>الأعداد ضمن ١٠٠'},
 mid:{n:'متوسط',e:'🟡',ball:8,sec:4,max:7,R:50,d:'٨ ثوانٍ للكرة — هدف إذا أجبت خلال ٤ ثوانٍ<br>الأعداد ضمن ٥٠'},
 pro:{n:'محترف',e:'🔴',ball:8,sec:4,max:7,R:200,d:'٨ ثوانٍ للكرة — هدف إذا أجبت خلال ٤ ثوانٍ<br>الأعداد ضمن ٢٠٠'}
};
function lvl(){return LEVELS[player.level]||LEVELS.easy;}
function rng(){return lvl().R;}
var CUPT={ball:8,sec:4};
var CUPWIN=6;
function tim(){return penMode?CUPT:lvl();}
function needLevel(n){return '';}
var KITS=[
 {id:'white',n:'أبيض',c:'#ffffff',d:'#8d99a6',t:'#2b2b2b'},
 {id:'black',n:'أسود',c:'#2f3542',d:'#141820',t:'#fff'},
 {id:'gray',n:'رمادي',c:'#95a5a6',d:'#5d6d6e',t:'#fff'},
 {id:'red',n:'أحمر',c:'#e74c3c',d:'#9b2d21',t:'#fff'},
 {id:'maroon',n:'عنابي',c:'#8e1b2e',d:'#54101c',t:'#fff'},
 {id:'orange',n:'برتقالي',c:'#e8710a',d:'#9c4a05',t:'#fff'},
 {id:'yellow',n:'أصفر',c:'#f6b93b',d:'#a8750a',t:'#2b1b00'},
 {id:'gold',n:'ذهبي',c:'#c9a227',d:'#7d6210',t:'#2b1b00'},
 {id:'green',n:'أخضر',c:'#1e9e5a',d:'#0f6e3c',t:'#fff'},
 {id:'dgreen',n:'أخضر غامق',c:'#0b5f3a',d:'#063d25',t:'#fff'},
 {id:'teal',n:'فيروزي',c:'#079992',d:'#04615c',t:'#fff'},
 {id:'sky',n:'سماوي',c:'#4bb3e8',d:'#1f6f99',t:'#083a52'},
 {id:'blue',n:'أزرق',c:'#1E6FD9',d:'#124A94',t:'#fff'},
 {id:'navy',n:'كحلي',c:'#14315e',d:'#0a1c38',t:'#fff'},
 {id:'purple',n:'بنفسجي',c:'#8e44ad',d:'#5b2a70',t:'#fff'},
 {id:'pink',n:'وردي',c:'#e84393',d:'#99235c',t:'#fff'},
 {id:'brown',n:'بني',c:'#7b4b2a',d:'#4a2c16',t:'#fff'},
 {id:'cream',n:'بيج',c:'#f1e3c6',d:'#b09a6e',t:'#4a3a12'}
];
var NUMS=[1,4,6,7,8,9,10,11,17,23];
var PATS=[{id:'p0',n:'سادة'},{id:'p1',n:'مخطّطة طولية'},{id:'p2',n:'مخطّطة عرضية'},{id:'p3',n:'وشاح مائل'}];
var PCOLS=[
 {id:'w',n:'أبيض',c:'#ffffff'},
 {id:'k',n:'أسود',c:'#2c2c2a'},
 {id:'g',n:'ذهبي',c:'#f6b93b'},
 {id:'o',n:'برتقالي',c:'#e8710a'},

var TEACHER_CODE='7788';
var tapN=0,tapT=0;
function bindCred(){
  var c=document.getElementById('cred');if(!c)return;
  c.onclick=function(){
    var now=Date.now();

  };
}
function teacherGate(){
  var o=document.createElement('div');
  o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:5000;padding:18px';
  o.innerHTML='<div class="card" style="max-width:340px;width:100%;margin:0;text-align:center">'
   +'<h3>🔐 دخول المعلم</h3><p style="font-size:.84rem;color:#57606f;margin-bottom:10px">أدخل رمز المعلم</p>'
   +'<input class="in" id="tcode" type="tel" maxlength="6" placeholder="••••" style="letter-spacing:6px">'
   +'<button class="btn main" id="tok">دخول</button><button class="btn sec" id="tno">إلغاء</button></div>';
  document.body.appendChild(o);
  document.getElementById('tno').onclick=function(){document.body.removeChild(o);};
  document.getElementById('tok').onclick=function(){
    var v=document.getElementById('tcode').value.trim();

      player.teacher=!player.teacher;save();

}

/* التجهيز خطوة خطوة */
var WSTEPS=6;
function wizHead(step,title,sub){
  var dots='';
  for(var i=1;i<=WSTEPS;i++)dots+='<span style="display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 3px;background:'+(i<=step?'#079992':'#ced6e0')+'"></span>';
  return '<div class="card" style="text-align:center"><div>'+dots+'</div>'
   +'<h3 style="font-size:1.25rem;margin-top:10px">'+title+'</h3>'
   +(sub?'<p style="font-size:.84rem;color:#57606f;line-height:1.8">'+sub+'</p>':'')+'</div>';
}
function savedCard(label,value){
  return '<div class="card" style="border:3px solid #2ecc71;background:#f3fbf6">'
   +'<div style="display:flex;align-items:center;gap:10px">'
   +'<div style="font-size:1.6rem">✅</div>'
   +'<div style="flex:1"><div style="font-size:.76rem;color:#57606f;font-weight:700">'+label+'</div>'
   +'<div style="font-size:1.1rem;font-weight:800;color:#0a3d62">'+value+'</div></div>'
   +'<button class="btn sec" id="wedit" style="width:auto;margin:0;padding:9px 14px">✏️ تعديل</button>'
   +'</div></div>';
}
function wiz(step,editing){
  var h='<div class="screen active" style="padding-top:16px">';
  var mode='';

  if(step===1){
    var have=!!player.name&&!editing;
    h+=wizHead(1,'🧑 اسم اللاعب','يظهر على فنيلتك وفي بطاقة اللاعب.');
    if(have){ h+=savedCard('اسم اللاعب',player.name); mode='next'; }
    else { h+='<div class="card"><input class="in" id="nm" maxlength="10" placeholder="اكتب اسمك" value="'+(player.name||'')+'"></div>'; mode='save'; }
  }
  else if(step===2){
    var have2=!!player.team&&!editing;
    h+=wizHead(2,'🛡️ اسم فريقك','اختر أي اسم تحبه — يظهر في لوحة النتيجة.');
    if(have2){ h+=savedCard('اسم الفريق',player.team); mode='next'; }
    else { h+='<div class="card"><input class="in" id="tm" maxlength="16" placeholder="اكتب اسم فريقك" value="'+(player.team||'')+'"></div>'; mode='save'; }
  }
  else if(step===3){
    var have3=player.kitSaved&&!editing;
    h+=wizHead(3,'👕 صمّم فنيلتك','اختر رقمك، ولونك الأساسي، والنقش ولونه.');
    h+='<div class="card" style="text-align:center"><div id="pv">'+shirt(120,kit(),player.num,player.name)+'</div></div>';
    if(have3){ h+=savedCard('الفنيلة','رقم '+player.num+' — '+kit().n+' — '+patn().n); mode='next'; }
    else {
      h+='<div class="card"><h3>🔢 الرقم (من 1 إلى 99)</h3>'
       +'<div style="display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:10px">'
       +'<button class="num" id="nplus" style="min-width:52px">+</button>'
       +'<input id="nfld" type="number" min="1" max="99" value="'+player.num+'" inputmode="numeric" style="width:96px;text-align:center;font-size:1.5rem;font-weight:700;padding:8px;border-radius:12px;border:2px solid #ced6e0;direction:ltr">'
       +'<button class="num" id="nmin" style="min-width:52px">−</button></div>'
       +'<div class="nums">';
      NUMS.forEach(function(n){h+='<button class="num'+(n===player.num?' on':'')+'" data-n="'+n+'">'+n+'</button>';});
      h+='</div><h3>🎨 اللون الأساسي</h3><div class="cols">';
      KITS.forEach(function(k){h+='<button class="col colk'+(k.id===player.kit?' on':'')+'" data-k="'+k.id+'">'+shirt(52,k,player.num,'',player.pat,player.pc)+'<div>'+k.n+'</div></button>';});
      h+='</div><h3>🧵 النقش</h3><div class="cols">';
      PATS.forEach(function(q){h+='<button class="col pat'+(q.id===player.pat?' on':'')+'" data-p="'+q.id+'">'+shirt(52,kit(),player.num,'',q.id,player.pc)+'<div>'+q.n+'</div></button>';});
      h+='</div><h3>🎨 لون النقش</h3><div class="chips">';
      PCOLS.forEach(function(q){h+='<button class="chip pcol'+(q.id===player.pc?' on':'')+'" data-c="'+q.id+'" title="'+q.n+'"><span style="background:'+q.c+'"></span><div>'+q.n+'</div></button>';});
      h+='</div></div>'; mode='save';
    }
  }
  else if(step===4){
    var have4=player.lvlSaved&&!editing;
    h+=wizHead(4,'🎚️ اختر مستواك','كلما ارتفع المستوى قلّ الوقت، ووصلت إلى مباريات أبعد.');
    if(have4){ h+=savedCard('المستوى',lvl().e+' '+lvl().n); mode='next'; }
    else {
      h+='<div class="card">';
      ['easy','mid','pro'].forEach(function(k){
        var L=LEVELS[k];
        h+='<button class="lvbtn'+(player.level===k?' on':'')+'" data-l="'+k+'"><b>'+L.e+' '+L.n+'</b><span>'+L.d+'</span></button>';
      });
      h+='</div>'; mode='save';
    }
  }
  else if(step===5){
    h+=wizHead(5,'📋 نظام البطولة','اقرأه جيدًا قبل أن تدخل الملعب.')+rulesCards(); mode='next';
  }
  else {
    h+=wizHead(6,'⚽ هل أنت مستعد؟','')
     +'<div class="card" style="text-align:center">'+shirt(140,kit(),player.num,player.name)
     +'<h3 style="font-size:1.3rem;margin-top:8px">'+player.name+' — '+player.team+'</h3>'
     +'<p style="font-size:.9rem;color:#57606f;font-weight:700;line-height:1.9">رقم '+player.num+' — '+kit().n+'<br>المستوى: '+lvl().e+' '+lvl().n+'</p></div>'; mode='go';
  }

  if(mode==='save') h+='<button class="btn main" id="wsave">💾 حفظ</button>';
  else if(mode==='next') h+='<button class="btn main" id="wnext">التالي ⟵</button>';
  else h+='<button class="btn main" id="wgo">⚽ ابدأ البطولات</button>';
  h+='<button class="btn sec" id="wback">⟶ السابق</button></div>';
  document.getElementById('app').innerHTML=h;

  function pv(){var e=document.getElementById('pv');if(e)e.innerHTML=shirt(120,kit(),player.num,player.name);}
  var ns=document.querySelectorAll('.num');
  for(var i=0;i<ns.length;i++)ns[i].onclick=function(){
    ac();tone(880,0,.1,'sine',.18);
    for(var j=0;j<ns.length;j++)if(ns[j].getAttribute('data-n'))ns[j].className='num';
    this.className='num on';setNum(this.getAttribute('data-n'));
  };
  function setNum(v){v=parseInt(v,10);if(isNaN(v))v=1;if(v<1)v=1;if(v>99)v=99;player.num=v;
    var f=document.getElementById('nfld');if(f&&parseInt(f.value,10)!==v)f.value=v;pv();}
  var fld=document.getElementById('nfld');
  if(fld)fld.oninput=function(){setNum(this.value);};
  var bmin=document.getElementById('nmin'),bpl=document.getElementById('nplus');
  if(bmin)bmin.onclick=function(){ac();tone(660,0,.08,'sine',.15);setNum(player.num-1);};
  if(bpl)bpl.onclick=function(){ac();tone(880,0,.08,'sine',.15);setNum(player.num+1);};
  var cs=document.querySelectorAll('.colk');
  for(var i2=0;i2<cs.length;i2++)cs[i2].onclick=function(){
    player.kit=this.getAttribute('data-k');ac();tone(880,0,.1,'sine',.18);
    for(var j=0;j<cs.length;j++)cs[j].className='col colk';this.className='col colk on';pv();
  };
  var ps2=document.querySelectorAll('.pat');
  for(var ip=0;ip<ps2.length;ip++)ps2[ip].onclick=function(){
    player.pat=this.getAttribute('data-p');ac();tone(880,0,.1,'sine',.18);wiz(3,true);
  };
  var pc2=document.querySelectorAll('.pcol');
  for(var ic=0;ic<pc2.length;ic++)pc2[ic].onclick=function(){
    player.pc=this.getAttribute('data-c');ac();tone(880,0,.1,'sine',.18);wiz(3,true);
  };
  var ls=document.querySelectorAll('.lvbtn');
  for(var i3=0;i3<ls.length;i3++)ls[i3].onclick=function(){
    player.level=this.getAttribute('data-l');ac();tone(880,0,.1,'sine',.18);
    for(var j=0;j<ls.length;j++)ls[j].className='lvbtn';this.className='lvbtn on';
  };

  var ed=document.getElementById('wedit');
  if(ed)ed.onclick=function(){ac();wiz(step,true);};

  var sv=document.getElementById('wsave');
  if(sv)sv.onclick=function(){
    if(step===1){
      var v=document.getElementById('nm').value.replace(/\s+/g,' ').trim();
      if(!v){document.getElementById('nm').style.borderColor='#e74c3c';return;}
      player.name=v;
    }
    if(step===2){
      var t=document.getElementById('tm').value.replace(/\s+/g,' ').trim();
      if(!t){document.getElementById('tm').style.borderColor='#e74c3c';return;}
      player.team=t;
    }
    if(step===3)player.kitSaved=1;
    if(step===4)player.lvlSaved=1;
    save();ac();sGoal();wiz(step,false);
  };

  var nx=document.getElementById('wnext');
  if(nx)nx.onclick=function(){ac();sGoal();wiz(step+1,false);};
  var gobtn=document.getElementById('wgo');
  if(gobtn)gobtn.onclick=function(){ac();sWin();showPick();};
  document.getElementById('wback').onclick=function(){ac();if(step>1)wiz(step-1,false);else showStart();};
}

function cells(on,total,mv,gap){

    var c='cel';

    if(mv&&i>=on&&i<on+mv)c+=' mv';

  }
  return h+'</div>';
}
function nline(from,to,jumps){
  var W=300,H=74,pad=18,span=to-from,x=function(v){return pad+(v-from)/span*(W-pad*2);};
  var h='<svg viewBox="0 0 '+W+' '+H+'" class="nline"><line x1="'+pad+'" y1="52" x2="'+(W-pad)+'" y2="52" stroke="#0a3d62" stroke-width="2.5"/>';
  for(var v=from;v<=to;v++){
    var big=(v%5===0);
    h+='<line x1="'+x(v)+'" y1="'+(big?44:48)+'" x2="'+x(v)+'" y2="56" stroke="#0a3d62" stroke-width="'+(big?2:1)+'"/>';
    if(big)h+='<text x="'+x(v)+'" y="70" text-anchor="middle" font-size="11" fill="#0a3d62" font-weight="700">'+ar(v)+'</text>';
  }
  (jumps||[]).forEach(function(j){
    var x1=x(j[0]),x2=x(j[1]),mid=(x1+x2)/2;
    h+='<path d="M'+x1+' 48 Q'+mid+' 14 '+x2+' 48" fill="none" stroke="#2ecc71" stroke-width="3"/>'
     +'<circle cx="'+x2+'" cy="48" r="4" fill="#2ecc71"/>'
     +'<text x="'+mid+'" y="18" text-anchor="middle" font-size="13" fill="#0b6a38" font-weight="800">+'+ar(j[1]-j[0])+'</text>';
  });
  return h+'</svg>';
}

   +'<div class="dvq">'+ar(c.a)+' '+sign+' '+ar(c.b)+' = '+ar(c.ans)+'</div>'
   +h+'</div>';
}
function optsFor(q){return shuffle([q.ans].concat(badFor(q)));}

function startMatch(n){campMode=0;penMode=false;team=n;qs=buildMatch(n);idx=0;me=0;op=0;goldNow=0;showQ();}

function showQ(){
  BACK=function(){clearInterval(timer);if(penMode)showPens();else showLeague();};

function hintHtml(c){
  var T=TEAM[c.sk],h='';

function run(){
  clearInterval(timer);t0=Date.now();

    var tb=document.getElementById('tb');
    var B=tim().ball;var left=Math.max(0,B-(Date.now()-t0)/1000);

  },70);
}
function showNext(){
  var last=(idx>=qs.length-1);

  document.getElementById('nb').onclick=function(){idx++;showQ();};
}
function answer(v,el){
  if(locked)return;locked=true;clearInterval(timer);
  var secs=(Date.now()-t0)/1000,c=qs[idx],st=cell(c.sk);
  var ok=(v===c._a),p=c.a*c.b;
  var bs=document.querySelectorAll('.opt');
  for(var i=0;i<bs.length;i++){bs[i].disabled=true;if(parseInt(bs[i].getAttribute('data-v'),10)===c._a)bs[i].className='opt ok';}
  if(!ok&&el)el.className='opt no';
  var bl=document.getElementById('bl');if(bl)bl.textContent=ar(c._a);
  var qb=document.getElementById('qb'),fb=document.getElementById('fb');
  var head,line,bg,col,scored=false;
  var shown=Math.round(secs*10)/10;
  if(ok&&shown<=tim().sec){
    me++;player.goals=(player.goals||0)+1;scored=true;
    var was=st.level>=GOLD,gold=false;
    if(!usedHint){st.level=Math.min(GOLD,st.level+1);if(!st.best||secs<st.best)st.best=secs;gold=!was&&st.level>=GOLD;if(gold)goldNow++;}
    burst();if(gold)sGold();else sGoal();
    bg='#d4efdf';col='#0b6a38';head='⚽ قـــول! سجّلتَ هدفًا';
    line=ar(c.a)+' '+(c.op==='+'?'+':'−')+' '+ar(c.b)+' = '+ar(c.ans)+' في '+ar(secs.toFixed(1))+' ثانية'+(gold?'<br>🧤 وصارت تسديدة مضمونة':'');
  } else if(ok){
    if(!usedHint){st.level=Math.max(1,st.level);if(!st.best||secs<st.best)st.best=secs;}
    sGoal();
    bg='#fff3cd';col='#856404';
    if(penMode){
      head='🧤 أنقذتَ مرماك من هدف — لم يسجّل الحارس';
      line=ar(c.a)+' '+(c.op==='+'?'+':'−')+' '+ar(c.b)+' = '+ar(c.ans)+' — تأخرت '+ar(secs.toFixed(1))+' ثانية<br>سدّد خلال '+ar(tim().sec)+' ثوانٍ ليصير هدفًا';
    } else {
      head='🧤 أنقذتَ مرماك من هدف';
      line=ar(c.a)+' '+(c.op==='+'?'+':'−')+' '+ar(c.b)+' = '+ar(c.ans)+' — تأخرت '+ar(secs.toFixed(1))+' ثانية<br>أجِب خلال '+ar(tim().sec)+' ثوانٍ ليصير هدفًا';
    }
  } else {
    var cost=(penMode||campMode)?1:team;
    op+=cost;st.level=Math.max(0,st.level-1);mustCoach=true;
    sSave();if(qb)qb.className='qbox shake';
    bg='#fadbd8';col='#8a2318';
    head=penMode?'🧤 تصدّاها الحارس':('⚠️ هجمة مرتدة — الخصم سجّل '+ar(cost));
    line=ar(c.a)+' '+(c.op==='+'?'+':'−')+' '+ar(c.b)+' = '+ar(c.ans)+(penMode?'':'<br>كل خطأ في هذه المباراة يعطي الخصم '+ar(team)+' أهداف');
  }
  var mn=document.getElementById('meN'),on=document.getElementById('opN');
  if(mn)mn.textContent=me; if(on)on.textContent=op;
  var qg=document.getElementById('qgrid');if(qg)qg.className='qgrid fbon';

  fb.innerHTML='<div class="fb" style="background:'+bg+'">'+(scored?goalNet():'')+'<h4 style="color:'+col+'">'+head+'</h4><p style="color:'+col+'">'+line+'</p></div>';
  if(mustCoach){
    document.getElementById('coachwrap').innerHTML='<button class="coachbtn must" id="hint">🛟 لازم تسأل المدرّب قبل الكرة التالية</button>';
    document.getElementById('hint').onclick=function(){
      this.style.display='none';
      document.getElementById('coach').innerHTML=hintHtml(c);
      mustCoach=false;showNext();
    };
  } else showNext();
  save();
}
